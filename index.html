<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给你的小惊喜</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>❤️ 给你的一封信 ❤️</h1>
        <div class="message">
            <p>郝同学</p>
            <p>感谢你出现在我的生活中，每一天都因为有你而变得特别。</p>
            <p>把鼠标悬停在下面的按钮上，看看我的小心意！</p>
        </div>
        <button class="surprise-btn">点我看看惊喜</button>
        <div class="surprise-message">
            <p>特定的时间，遇见特别的你！</p>
            <p>❤️❤️❤️❤️❤️</p>
        </div>
    </div>

    <!-- 星星背景 -->
    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>
</body>
</html>
